gateway:
  id: "GW001"
  name: "Development Gateway"

api:
  listen_addr: ":8080"

database:
  path: "./data/gateway.db"

queue:
  # path: "./data/queue.db" # default: queue.db next to database.path
  max_bytes: 1073741824 # 1 GiB cap on queue.db; the oldest data is evicted above it
  min_free_percent: 10 # keep this much of the volume free; the oldest data is evicted below it
  flush_interval_ms: 2000 # readings are written as one compressed chunk per interval (the most lost on power failure)
  maintenance_interval_seconds: 30

forwarder:
  transport: "http" # "http" (dev/test, cmd/server-sim) or "mqtt"
  server_url: "http://localhost:9000/ingest"
  max_readings_per_message: 2000
  poll_interval_ms: 1000
  send_timeout_ms: 5000

log:
  level: "debug"
  format: "text"

mqtt:
  broker_url: "tcp://localhost:1883"
  client_id: "GW001"
  username: ""
  password: ""
  qos: 1
  data_topic: "" # default: gateway/<client_id>/data
  ack_topic: "" # default: gateway/<client_id>/ack
  keepalive_seconds: 30
  connect_timeout_ms: 5000
  publish_timeout_ms: 5000
  ack_timeout_ms: 10000
  tls:
    enabled: false
    ca_file: ""
    cert_file: ""
    key_file: ""
    insecure_skip_verify: false

time:
  ntp_server: "" # e.g. the internal network's NTP server; empty disables NTP sync (falls back to RTC/local clock)
  timezone: "UTC"
  sync_interval_seconds: 300
  query_timeout_ms: 3000
  rtc_device: "/dev/rtc0" # Linux only; ignored elsewhere
